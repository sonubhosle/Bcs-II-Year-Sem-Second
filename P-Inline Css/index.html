<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inline CSS Example</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #eef2ff, #f5f5f5); display: flex; justify-content: center; align-items: center; min-height: 100vh;">

  <div style="background: white; max-width: 500px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center;">
    <h1 style="color: #1e3a8a; font-size: 32px; margin-bottom: 15px;">Inline CSS Example</h1>
    <p style="color: #374151; font-size: 18px; line-height: 1.6; margin-bottom: 25px;">
      This page demonstrates CSS applied directly using inline style attributes in HTML.
    </p>
    <button style="background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer;">
      Click Me
    </button>
  </div>

</body>
</html>
