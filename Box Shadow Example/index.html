<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow Examples</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Box Shadow Examples</h1>

    <div class="shadows">

        <div class="box all-shadow">
            All Side Shadow
        </div>

        <div class="box left-shadow">
            Left Shadow
        </div>

        <div class="box right-shadow">
            Right Shadow
        </div>

        <div class="box top-shadow">
            Top Shadow
        </div>

        <div class="box bottom-shadow">
            Bottom Shadow
        </div>

    </div>

    <h1>Button Examples </h1>


<div class="button-container">
    <button class="btn btn1">Blue Button</button>
    <button class="btn btn2">Green Button</button>
    <button class="btn btn3">Red Button</button>
    <button class="btn btn4">Purple Button</button>
    <button class="btn btn5">Orange Button</button>
    <button class="btn btn6">Dark Button</button>
</div>
</body>
</html>
