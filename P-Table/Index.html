<!DOCTYPE html>
<html>
<head>
  <title>Table Using CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 30px;
    }

    table {
      width: 60%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #e0f7fa;
    }
  </style>
</head>
<body>
  <h2>Student Information</h2>

  <table>
    <tr>
      <th>Name</th>
      <th>Class</th>
      <th>Roll No.</th>
    </tr>
    <tr>
      <td>Ram</td>
      <td>10-A</td>
      <td>12</td>
    </tr>
    <tr>
      <td>Sita</td>
      <td>10-A</td>
      <td>15</td>
    </tr>
    <tr>
      <td>Hari</td>
      <td>10-B</td>
      <td>22</td>
    </tr>
  </table>
</body>
</html>
