<!DOCTYPE html>
<html>
<head>
  <title>List Using CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 30px;
    }

    h2 {
      color: #333;
    }

    ul {
      list-style-type: square;
      background-color: #fff;
      padding: 20px 40px;
      border: 2px solid #4CAF50;
      border-radius: 10px;
      width: 250px;
    }

    li {
      color: #333;
      font-size: 18px;
      padding: 8px;
      margin: 5px 0;
      border-bottom: 1px solid #ddd;
    }

    li:hover {
      background-color: #e8f5e9;
      color: #2e7d32;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>My Favorite Subjects</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
    <li>PHP</li>
    <li>Python</li>
  </ul>
</body>
</html>
